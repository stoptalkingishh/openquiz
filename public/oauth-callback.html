<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Completing sign-in…</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0;
         display: flex; align-items: center; justify-content: center; min-height: 100vh;
         color: #0f172a; background: #f8fafc; text-align: center; padding: 2rem; }
  .box { max-width: 28rem; }
  h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
  p { margin: 0; color: #475569; font-size: .9rem; }
  .err { color: #b91c1c; }
</style>
</head>
<body>
<div class="box">
  <h1 id="heading">Completing sign-in…</h1>
  <p id="detail">Returning you to OpenQuiz.</p>
</div>
<script>
  // OAuth redirect target. It hands the result back to the app by navigating to
  // the app root in the SAME tab, rather than postMessaging to a popup.
  //
  // The popup approach was fragile: it depended on window.opener surviving a
  // cross-origin round trip, on postMessage delivery, and on being able to poll
  // popup.closed (which Cross-Origin-Opener-Policy blocks). A same-tab
  // navigation has none of those failure modes, and sessionStorage - which
  // holds the PKCE verifier - survives it.
  //
  // The token exchange deliberately stays in the app: this file stays
  // dependency-free, and all the security-relevant logic remains in tested
  // TypeScript.
  (function () {
    var heading = document.getElementById('heading');
    var detail = document.getElementById('detail');

    function fail(message) {
      heading.textContent = 'Sign-in did not complete';
      heading.className = 'err';
      detail.textContent = message;
    }

    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    var state = params.get('state');
    var error = params.get('error');

    if (error) {
      var description = params.get('error_description') || error;
      fail(description);
      // Still hand the error to the app so it can surface a retry path.
      try {
        window.location.replace('./?oq_error=' + encodeURIComponent(description));
      } catch (e) { /* leaving the message on screen is enough */ }
      return;
    }

    if (!code || !state) {
      fail('Google did not return an authorization code.');
      return;
    }

    // Resolve the app root the same way the app does, so this works under the
    // deployment base path as well as on localhost.
    var base = window.location.pathname.replace(/[^/]*$/, '');
    window.location.replace(base + '?oq_code=' + encodeURIComponent(code) + '&oq_state=' + encodeURIComponent(state));
  })();
</script>
</body>
</html>
